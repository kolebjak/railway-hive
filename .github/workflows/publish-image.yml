# Publishes the wrapper images the Railway template deploys. Deploying from a
# prebuilt image means nobody who uses the template needs a GitHub connection,
# and every deploy runs the exact bytes that were tested here.
name: Publish images

on:
  push:
    branches: [main]
    paths:
      - services/**
      - .github/workflows/publish-image.yml
    tags: ['v*']
  workflow_dispatch:

env:
  # Hive release every image here wraps. Bump together with services/*/Dockerfile
  # and HIVE_TAG in .env.example.
  HIVE_TAG: 14.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [server, broker, s3, redis]
    steps:
      - uses: actions/checkout@v4

      # Railway runs amd64; arm64 keeps `docker compose up` native on Apple Silicon.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ env.HIVE_TAG }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
